// Unlike other featureful cfg files, this one is truly a config file executed as server command.
// It must adhere to the engine cfg format, therefore cvar values must be written in quotation marks.

// Default pushable mode for func_pushables.
// -1 is legacy Half-Life (allow accelerated push with +use).
// 0 is Anniversary HL (fix excessive acceleration).
// 1 is XashXT (allow pushing sideways. Require going back when pressing +use on the pushable).
pushablemode "0"

// Default item pickup policy. 0 is by touch only (like in HL), 1 is by pressing +use only. 2 allows picking up the item by both touching and pressing +use.
pickup_policy "0"

// Triangulation depth to use when building paths for monsters. Possible values: 1, 2, 3. Note that higher values may affect the performance.
npc_tridepth "1"

// If set to 0, only player's followers and monsters in scripts will use the value specified by npc_tridepth as the triangulation depth, and other monsters will use the value 1.
// If set to 1, all monsters will use the value specified by npc_tridepth. Note that this may affect the performance.
npc_tridepth_all "0"

// If monster didn't observe its enemy for this amount of time (in seconds), the monster forgets about their enemy. Setting 0 means that monsters never forget their enemies (i.e., the standard behavior in Half-Life).
npc_forget_enemy_time "0"

// If set to 1, monsters will wander around a bit after the combat ends.
npc_active_after_combat "0"

// In original Half-Life melee-only monsters can't get path to enemy (e.g. player) if he stays on some small elevation like a table. Set this to 1 to allow monsters find a path to the enemy on the elevation. This is experimental.
npc_get_to_enemy_nearest "0"

// In original Half-Life some monsters (e.g. zombies) perform the hull trace for melee attacks from the center of their bodies. This doesn't allow to hurt the enemy on the small elevation or on lower ground. Set this to 1 in order to introduce the attack retry from higher and lower positions.
npc_trace_hull_attack_retry "0"

// In original Half-Life some monsters (e.g. human grunts) could apply the velocity to any entity when they kick it (if the entity's physics allow it), either accidentally or via scripted sequence. Generally this is not desirable behavior so it got reworked in Featureful, but it's still configurable via cvar.
// -1 - don't allow kicking anything besides monsters, players and pushables
// 0 - allow kicking func_door_rotating in scripted sequences
// 1 - allow kicking anything (vanilla behavior)
// 2 - allow kicking anything but only in scripted sequences
npc_vanilla_kick_behavior "0"

// Attempt to fix item_ and ammo_ entities falling physics. This is experimental as some values lead to other bugs.
// 0 - default Half-Life behavior (items fall through in a tight space).
// 1 - items dropped from func_breakable boxes placed in a tight space don't fall through. Items still fall through if box is in the air.
// 2 - same effect as 1 plus items placed in a tight space don't fall through at the level start. But prespawned items start to fall through clip brushes.
// 3 - same effect as 1 plus fix for boxes in the air. Items placed in a tight space don't fall through, but they fall through clip brushes no matter whether they're prespawned or come from func_breakable.
items_physics_fix "0"

// Show monsters' display names and current health in singleplayer when player looks at the monster.
// 0 - don't show monster info.
// 1 - show info for all monsters.
// 2 - show info only for ally monsters.
// 3 - show info only for ally monsters when player is currently equipped with a portable medkit.
sp_allowmonsterinfo "0"
