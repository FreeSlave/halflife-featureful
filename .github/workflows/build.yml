name: build

on: 
  push:
    paths-ignore:
      - 'documentation/**'
      - 'modelsrc/**'
      - 'appveyor.yml'
      - 'README.md'
      - '.github/workflows/manual*.yml'
  pull_request:
    paths-ignore:
      - 'documentation/**'
      - 'modelsrc/**'
      - 'appveyor.yml'
      - 'README.md'
      - '.github/workflows/manual*.yml'

jobs:
  definitions:
    runs-on: ubuntu-latest

    outputs:
      vgui_build: ${{ steps.vgui_build.outputs.vgui_build }}
      branch: ${{ steps.extract_branch.outputs.branch }}
      gamedir: ${{ steps.extract_gamedir.outputs.gamedir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: mod_options.txt
      - name: Define VGUI build type
        id: vgui_build
        run: |
          echo 'vgui_build=["non-vgui", "vgui"]' >> "$GITHUB_OUTPUT"
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/} | tr '/' '_')" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Extract gamedir
        shell: bash
        run: echo "gamedir=$(grep mod_options.txt -Ee 'GAMEDIR=[a-z]+' | cut -d '=' -f 2 | cut -d' ' -f 1)" >> $GITHUB_OUTPUT
        id: extract_gamedir
  build:
    runs-on: ${{ matrix.os }}
    needs: [definitions]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        vgui_build: ${{ fromJSON(needs.definitions.outputs.vgui_build) }}
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      STEAMRT_SNAPSHOT: latest-steam-client-general-availability
      include_features: "false"
      fgd_name: "halflife_featureful.fgd"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup VGUI-related environment variables
      shell: bash
      run: |
        if [ ${{ matrix.vgui_build }} == 'vgui' ]
        then
        echo "USE_VGUI=ON" >> "$GITHUB_ENV"; echo "vgui_suffix=vgui" >> "$GITHUB_ENV"
        else
        echo "USE_VGUI=OFF" >> "$GITHUB_ENV"; echo "vgui_suffix=novgui" >> "$GITHUB_ENV"
        fi

    - name: Checkout steam-runtime
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/checkout@v4
      with:
        repository: ValveSoftware/steam-runtime
        path: steam-runtime
    - name: Cache steam-runtime
      if: startsWith(matrix.os, 'ubuntu')
      id: cache-steam-runtime
      uses: actions/cache@v4
      with:
        path: com.valvesoftware.SteamRuntime.Sdk-i386-scout-sysroot.tar.gz
        key: steam-runtime-${{ env.STEAMRT_SNAPSHOT }}
    - name: Download steam-runtime
      if: startsWith(matrix.os, 'ubuntu') && steps.cache-steam-runtime.outputs.cache-hit != 'true'
      run: wget --no-verbose https://repo.steampowered.com/steamrt-images-scout/snapshots/${{ env.STEAMRT_SNAPSHOT }}/com.valvesoftware.SteamRuntime.Sdk-i386-scout-sysroot.tar.gz
    - name: Install steam runtime
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        ./steam-runtime/setup_chroot.sh --i386 --tarball ./com.valvesoftware.SteamRuntime.Sdk-i386-scout-sysroot.tar.gz
        sudo sed -i 's/groups=sudo/groups=adm/g' /etc/schroot/chroot.d/steamrt_scout_i386.conf

    - name: Build on Linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        schroot --chroot steamrt_scout_i386 -- cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DPOLLY=ON -B build -S . -DCMAKE_EXE_LINKER_FLAGS="-Wl,--no-undefined" -DUSE_VGUI=${{ env.USE_VGUI }} -DCMAKE_INSTALL_PREFIX="$PWD/dist"
        if [ ${{ env.USE_VGUI == 'ON' }} ]; then cp vgui_support/vgui-dev/lib/vgui.so build/cl_dll; cp vgui_support/vgui-dev/lib/vgui.so build ; fi
        schroot --chroot steamrt_scout_i386 -- cmake --build build --target all
        schroot --chroot steamrt_scout_i386 -- cmake --build build --target install

    - name: Set developer command prompt for Windows x86
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build on Windows
      if: startsWith(matrix.os, 'windows')
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build -S . -DUSE_VGUI=${{ env.USE_VGUI }} -DCMAKE_INSTALL_PREFIX="dist"
        cmake --build build --target all
        cmake --build build --target install

    - name: Copy fgd to dist dir
      run: cp fgd/halflife.fgd dist/${{ needs.definitions.outputs.gamedir }}/${{ env.fgd_name }}

    - name: Copy features to dist dir
      shell: bash
      if:  ${{ env.include_features == 'true' }}
      run: |
        cp -r features/ dist/${{ needs.definitions.outputs.gamedir }}/
        if [ -d templates ]
        then
            cp -r templates/ dist/${{ needs.definitions.outputs.gamedir }}/
        fi
        if [ -d sound ]
        then
            cp -r sound/ dist/${{ needs.definitions.outputs.gamedir }}/
        fi
        if [ -d sprites ]
        then
            cp -r sprites/ dist/${{ needs.definitions.outputs.gamedir }}/
        fi

    - name: Install Google Test
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt -y install libgtest-dev

    - name: Run tests
      if: startsWith(matrix.os, 'ubuntu')
      working-directory: ./tests
      run: |
        cmake -GNinja -B build -S .
        cmake --build build --target all
        ./build/test

    - name: Upload linux artifact
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: hlsdk-${{ needs.definitions.outputs.branch }}-linux-${{ env.vgui_suffix }}
        path: dist/${{ needs.definitions.outputs.gamedir }}
    - name: Upload windows artifact
      if: startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: hlsdk-${{ needs.definitions.outputs.branch }}-windows-${{ env.vgui_suffix }}
        path: dist/${{ needs.definitions.outputs.gamedir }}

  release:
    if: false
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Fetch artifacts
        if: ${{ github.event_name == 'push' && !github.event.pull_request }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Remove old release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        if: ${{ github.event_name == 'push' && !github.event.pull_request }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: continuous-${{ github.ref_name }}
          delete_release: true

      - name: Prepare release
        if: ${{ github.event_name == 'push' && !github.event.pull_request }}
        continue-on-error: true
        run: |
          cd artifacts/
          for i in hlsdk-*; do
            zip -r "$i" "$i"
            rm -rf "$i"
          done
          cd ..
          sleep 20s

      - name: Upload new release
        if: ${{ github.event_name == 'push' && !github.event.pull_request }}
        uses: softprops/action-gh-release@v0.1.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: artifacts/hlsdk-*.zip
          tag_name: continuous-${{ github.ref_name }}
          draft: false
          prerelease: true
          name: hlsdk-portable ${{ github.ref_name }} development build

  merge:
    runs-on: ubuntu-latest
    needs: [definitions, build]
    strategy:
      matrix:
        vgui_build: ${{ fromJSON(needs.definitions.outputs.vgui_build) }}
    steps:
      - name: Setup VGUI-related environment variables
        shell: bash
        run: |
            if [ ${{ matrix.vgui_build }} == 'vgui' ]
            then
            echo "vgui_suffix=vgui" >> "$GITHUB_ENV"; echo "vgui_artifact_suffix=-vgui" >> "$GITHUB_ENV";
            else
            echo "vgui_suffix=novgui" >> "$GITHUB_ENV"; echo "vgui_artifact_suffix=" >> "$GITHUB_ENV";
            fi
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: hlsdk-${{ needs.definitions.outputs.branch }}${{ env.vgui_artifact_suffix }}
          pattern: hlsdk-${{ needs.definitions.outputs.branch }}-*-${{ env.vgui_suffix }}
          delete-merged: true

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [definitions]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - name: Build and Sign APK
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/signingkey.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "${{ secrets.KEYSTORE_FILE }}" ]]; then
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ env.KEYSTORE_FILE_PATH }}
            ./gradlew assembleContinuous
            mv app/build/outputs/apk/continuous/app-continuous.apk HalfLife-Featureful.apk
          else
            ./gradlew assembleDebug
            mv app/build/outputs/apk/debug/app-debug.apk HalfLife-Featureful.apk
          fi
        working-directory: android
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hlsdk-${{ needs.definitions.outputs.branch }}-android
          path: android/HalfLife-Featureful.apk
